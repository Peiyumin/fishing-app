name: fishing_app
description: 垂钓社区 App —— 钓鱼天气、钓点导航、渔获分享（Flutter 双端）
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 后端：自建 Node + SQLite 服务（fishing_server），零第三方云依赖
  # 地图（OpenStreetMap 瓦片，免 Key）
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  # 图片加载/缓存
  cached_network_image: ^3.3.1
  # 发布时选图/拍照/选视频
  image_picker: ^1.1.2
  # 动态视频播放
  video_player: ^2.8.0
  # 启动广告点击跳转外部链接
  url_launcher: ^6.2.0
  # 定位
  geolocator: ^11.0.0
  # 日期格式化
  intl: ^0.19.0
  # 简单全局状态（登录态）
  provider: ^6.1.2
  gal: 2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# 将 latlong2 强制指向本地路径副本，规避沙箱里 pub 缓存延迟解压与编译的竞态
dependency_overrides:
  latlong2:
    path: ./vendor/latlong2

flutter:
  uses-material-design: true
  assets:
    - assets/
