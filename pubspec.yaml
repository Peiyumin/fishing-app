name: fishing_app
description: 垂钓社区 App —— 钓鱼天气、钓点导航、渔获分享（Flutter 双端）
publish_to: 'none'
version: 2.1.39+49

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 后端：自建 Node + SQLite 服务（fishing_server），零第三方云依赖
  # 地图（OpenStreetMap 瓦片，免 Key）
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  # 图片加载/缓存
  cached_network_image: ^3.3.1
  # 发布时选图/拍照/选视频
  image_picker: ^1.1.2
  # App 内相机（渔获拍照：全屏取景 + 快门 + 前后摄切换 + 长按录像）
  camera: ^0.11.0
  # 动态视频播放
  video_player: ^2.8.0
  # 启动广告点击跳转外部链接
  url_launcher: ^6.2.0
  # 定位
  geolocator: ^11.0.0
  # 权限自检：查询/申请定位、相机、相册、通知等系统权限，并跳转设置
  permission_handler: ^11.4.0
  # 日期格式化
  intl: ^0.19.0
  # 简单全局状态（登录态）
  provider: ^6.1.2
  # 本地持久化（登录态留存：退出 App 不掉线，重装才需重新登录）
  shared_preferences: ^2.2.2
  # 天气数据请求（Open-Meteo 双模型集合）
  http: ^1.2.0
  # 热更新：下载目录 + 安卓 apk 跳转安装
  path_provider: ^2.1.1
  open_filex: ^5.0.0
  gal: 2.1.1
  maplibre_gl: 0.22.0
  # 系统通知：私信 / 评论 / 点赞 / 官方公告到达时弹通知栏与横幅
  flutter_local_notifications: ^17.2.4
  # 按「字素簇」截断文本：昵称/地址里有 emoji 时，substring 会切出半个
  # 代理项，渲染成方块（lib/utils/text_safe.dart 依赖它）
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# 将 latlong2 强制指向本地路径副本，规避沙箱里 pub 缓存延迟解压与编译的竞态
dependency_overrides:
  latlong2:
    path: ./vendor/latlong2

flutter:
  uses-material-design: true
  assets:
    # 内置头像（新注册用户随机分配）—— 显式列出，确保打进安装包
    - assets/avatars/avatar_01.png
    - assets/avatars/avatar_02.png
    - assets/avatars/avatar_03.png
    - assets/avatars/avatar_04.png
    - assets/avatars/avatar_05.png
    - assets/avatars/avatar_06.png
    # 钓点地图数据（水域图层 + 禁钓区图层，随 App 版本更新）
    - assets/data/waters.json
    - assets/data/no_fishing_zones.json
    - assets/avatars/avatar_07.png
    - assets/avatars/avatar_08.png
    # 老安卓（5.x）缺失的现代根证书：让 Dart HTTP 信任现代 HTTPS（天气/定位反查）
    - assets/certs/isrg_root_x1.pem
    - assets/certs/digicert_global_root_g2.pem
    - assets/certs/gts_root_r4.pem
    # 真实鱼类素材（46 种，透明 PNG，约 3.6MB）：图鉴 / 钓鱼档案 / 池塘共用
    - assets/fish/
    # 池塘环境背景（斜俯视鸟瞰：池塘居中，四周树与小房子）
    - assets/pond/
    # 启动页底图（1140×2050 设计稿，胶囊已擦除，由 Dart 端重绘动画进度）
    - assets/startup/
