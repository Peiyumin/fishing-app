name: fishing_app
description: 垂钓社区 App —— 钓鱼天气、钓点导航、渔获分享（Flutter 双端）
publish_to: 'none'
version: 2.1.91+101

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 后端：自建 Node + SQLite 服务（fishing_server），零第三方云依赖
  # 地图（OpenStreetMap 瓦片，免 Key）
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  # 图片加载/缓存
  cached_network_image: ^3.3.1
  # 发布时选图/拍照/选视频
  image_picker: ^1.1.2
  # App 内相机（渔获拍照：全屏取景 + 快门 + 前后摄切换 + 长按录像）
  camera: ^0.11.0
  # 动态视频播放
  video_player: ^2.8.0
  # 启动广告点击跳转外部链接
  url_launcher: ^6.2.0
  # 定位
  geolocator: ^11.0.0
  # 权限自检：查询/申请定位、相机、相册、通知等系统权限，并跳转设置
  permission_handler: ^11.4.0
  # 日期格式化
  intl: ^0.19.0
  # 简单全局状态（登录态）
  provider: ^6.1.2
  # 本地持久化（登录态留存：退出 App 不掉线，重装才需重新登录）
  shared_preferences: ^2.2.2
  # 天气数据请求（Open-Meteo 双模型集合）
  http: ^1.2.0
  # 热更新：下载目录 + 安卓 apk 跳转安装
  path_provider: ^2.1.1
  open_filex: ^5.0.0
  gal: 2.1.1
  maplibre_gl: 0.22.0
  # 系统通知：私信 / 评论 / 点赞 / 官方公告到达时弹通知栏与横幅
  flutter_local_notifications: ^17.2.4
  # 按「字素簇」截断文本：昵称/地址里有 emoji 时，substring 会切出半个
  # 代理项，渲染成方块（lib/utils/text_safe.dart 依赖它）
  characters: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# 将 latlong2 强制指向本地路径副本，规避沙箱里 pub 缓存延迟解压与编译的竞态
dependency_overrides:
  latlong2:
    path: ./vendor/latlong2

flutter:
  uses-material-design: true
  assets:
    # 内置头像（新注册用户随机分配）—— 显式列出，确保打进安装包
    - assets/avatars/avatar_01.png
    - assets/avatars/avatar_02.png
    - assets/avatars/avatar_03.png
    - assets/avatars/avatar_04.png
    - assets/avatars/avatar_05.png
    - assets/avatars/avatar_06.png
    # 钓点地图数据（水域图层 + 禁钓区图层，随 App 版本更新）
    - assets/data/waters.json
    - assets/data/no_fishing_zones.json
    # 随包底图（v2.1.89）：z0~z8、覆盖中国范围的卫星瓦片（星图地球 img/webp，
    # 与在线底图同源、未加偏）。地图打开先用它秒出图，放大到 z9 以上再走网络。
    # 清单见 assets/tiles/manifest.json（OfflineTiles 依它解到本机给原生内核用）。
    #
    # ★ Flutter 的资源目录**不递归**：写 `assets/tiles/` 只会带上同级的
    #   manifest.json，img/z/x_y.webp 全丢。所以每个层级都要单独列一行
    #   （每层是扁平的一组文件，不写子目录也能带全）。
    - assets/tiles/manifest.json
    - assets/tiles/img/0/
    - assets/tiles/img/1/
    - assets/tiles/img/2/
    - assets/tiles/img/3/
    - assets/tiles/img/4/
    - assets/tiles/img/5/
    - assets/tiles/img/6/
    - assets/tiles/img/7/
    - assets/tiles/img/8/
    - assets/avatars/avatar_07.png
    - assets/avatars/avatar_08.png
    # 老安卓（5.x）缺失的现代根证书：让 Dart HTTP 信任现代 HTTPS（天气/定位反查）
    - assets/certs/isrg_root_x1.pem
    - assets/certs/digicert_global_root_g2.pem
    - assets/certs/gts_root_r4.pem
    # 真实鱼类素材（46 种，透明 PNG，约 3.6MB）：图鉴 / 钓鱼档案 / 池塘共用
    - assets/fish/
    # 池塘环境背景（斜俯视鸟瞰：池塘居中，四周树与小房子）
    - assets/pond/
    # 启动页底图（1140×2050 设计稿，胶囊已擦除，由 Dart 端重绘动画进度）
    - assets/startup/
    # 渔报表情（快捷回复栏 + 评论内展示；透明 PNG 256×256，已去底/去水印）
    - assets/stickers/
    # App 图标（登录页 Logo，1024×1024）
    - assets/branding/

  # 首页「渔报」两字的毛笔标题字（v2.1.84 引入，v2.1.85 换成龙藏行书）
  #
  # 为什么随包带字体、而不是用系统字体名：
  #   ① 系统里没有一款「笔锋犀利」的毛笔中文（iOS/安卓只有黑体/宋体），
  #      写 fontFamily: 'Songti SC' 这类名字在别的机器上解析不到 → 方块；
  #   ② 全量毛笔字族都有 4~5MB，而这里只用「渔」和「报」两个字，
  #      用 Google Fonts 的 text= 子集接口裁到 2.4KB，随包走零风险。
  # 只放这一个 family：别把正文也改成毛笔字，正文要的是可读性。
  #
  # v2.1.85：Ma Shan Zheng（厚楷）→ Long Cang（龙藏行书）。
  #   用户要「字更大、笔画更细」，厚楷放大只会更粗 —— 行书用笔瘦、收锋利，
  #   34pt 反而比原来 30pt 的厚楷更透气。文件名沿用 yubao_brush.ttf（只是容器名）。
  fonts:
    - family: YuBaoBrush
      fonts:
        - asset: assets/fonts/yubao_brush.ttf
