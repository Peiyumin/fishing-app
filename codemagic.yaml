# Codemagic 云端打包配置（垂钓圈 iOS）
# 用法见《iOS打包指南.txt》路线 A。本文件放在工程根目录，Codemagic 会自动识别。
#
# ⚠️ 签名需要 Apple 开发者账号（免费账号不能出 ipa，只能真机调试 7 天）。
# 在 Codemagic「Teams → Workflow settings → Code signing」里上传：
#   - iOS Distribution 证书（.p12 + 密码）
#   - Ad hoc / App Store 描述文件（.mobileprovision）

workflows:
  ios-ipa:
    name: 垂钓圈-iOS打包
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc      # ad_hoc=分发给指定设备 / app_store=上架TestFlight
        bundle_identifier: com.chuidiaoquan.app
      vars:
        EXPORT_METHOD: ad-hoc
    scripts:
      - name: 拉取依赖
        script: flutter pub get
      - name: 自动匹配签名
        script: xcode-project use-profiles
      - name: 打包 ipa
        script: flutter build ipa --release \
          --export-options-plist=$HOME/export_options.plist
      - name: 定位产物
        script: |
          set -e
          echo "ipa 路径: $(find build/ios/archive -name '*.ipa')"
    publishing:
      email:
        recipients:
          - 你的邮箱@example.com
        notify:
          success: true
          failure: true
      # 产物在 Codemagic 构建详情页 Appetize / Artifacts 里下载
