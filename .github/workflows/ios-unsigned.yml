# 垂钓圈 iOS 未签名 ipa 云端打包（GitHub Actions，免费）
# 产物：未签名 ipa（Artifact 下载后自行用爱思助手 / Sideloadly 签名安装）
# 触发：手动（Actions 页面点 Run workflow），或推送带 v* 的 tag
name: iOS-Unsigned-IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 拉取依赖
        run: flutter pub get

      - name: 编译 iOS（跳过签名）
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry 垂钓圈-unsigned.ipa Payload
          mv 垂钓圈-unsigned.ipa "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE" && rm -rf Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fishing-ios-unsigned-ipa
          path: 垂钓圈-unsigned.ipa
          retention-days: 30
