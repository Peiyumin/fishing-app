# 垂钓圈 iOS 未签名 ipa 云端打包（GitHub Actions，免费）
# 产物：未签名 ipa（Artifact 下载后自行用爱思助手 / Sideloadly 签名安装）
# 触发：手动（Actions 页面点 Run workflow），或推送带 v* 的 tag
name: iOS-Unsigned-IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: '构建机（macos-14 默认 / macos-13 / macos-15）'
        required: false
        default: 'macos-14'
  push:
    tags: ['v*']

jobs:
  build:
    # 默认 macos-14；免费账户高峰时段这台容易被「排队 15 分钟后取消」，
    # 手动触发时可以换 macos-13 再试一次（两个镜像不总是同时受限）。
    runs-on: ${{ inputs.runner || 'macos-14' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 pub 依赖
        uses: actions/cache@v4
        with:
          # ★ 不要缓存 build/ 目录。
          #   曾经因为缓存了 build/ios，Xcode 拿恢复出来的旧 .o 判定「无需重编」，
          #   结果 Swift 侧（AppDelegate 的微信桥）根本没进包，Dart 侧却是新的 ——
          #   表现就是「代码明明改了，用户装的包里没有」。宁可多编 2 分钟。
          path: ~/.pub-cache
          key: ios-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ios-pub-

      - name: 安装 Flutter（固定 3.24.5，与本地开发版本一致）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable

      - name: 选择兼容的 Xcode（如镜像里有 15.x 则优先）
        run: |
          for X in /Applications/Xcode_15.4.app /Applications/Xcode_15.0.app; do
            if [ -d "$X" ]; then sudo xcode-select -s "$X"; break; fi
          done
          xcodebuild -version

      - name: 拉取依赖
        run: flutter pub get

      - name: 清掉可能残留的 iOS 构建产物
        run: |
          rm -rf build/ios ios/Pods ios/.symlinks
          # permission_handler 的权限是编译期宏，Podfile 一变就必须重新 pod install
          echo "Podfile 权限宏："
          grep -n "PERMISSION_" ios/Podfile | head

      - name: 编译 iOS（跳过签名）
        run: flutter build ios --release --no-codesign

      - name: 校验产物里真的有这次的改动（防止缓存/增量编译静默用旧代码）
        run: |
          python3 - <<'PY'
          import os, plistlib, sys

          app_path = 'build/ios/iphoneos/Runner.app/Frameworks/App.framework/App'
          run_path = 'build/ios/iphoneos/Runner.app/Runner'
          pl_path  = 'build/ios/iphoneos/Runner.app/Info.plist'
          for p in (app_path, run_path, pl_path):
              if not os.path.exists(p):
                  print('MISS 产物不存在:', p); sys.exit(1)

          app = open(app_path, 'rb').read()
          runner = open(run_path, 'rb').read()
          pl = plistlib.load(open(pl_path, 'rb'))

          u16 = lambda s: s.encode('utf-16-le')
          checks = [
              ('Dart 快照：当前版本未内置微信登录', u16('当前版本未内置微信登录') in app),
              ('Dart 快照：一键开启全部权限',       u16('一键开启全部权限') in app),
              ('Dart 快照：接口 /auth/sms/login',   b'/auth/sms/login' in app),
              ('Dart 快照：通道 fishing/wechat',    b'fishing/wechat' in app),
              # v2.1.48 新增：一键登录（短信降级 + 运营商取号两条路）
              ('Dart 快照：本机号码一键登录',       u16('本机号码一键登录') in app),
              ('Dart 快照：用短信验证码登录',       u16('用短信验证码登录') in app),
              ('Dart 快照：其他手机号登录',         u16('其他手机号登录') in app),
              ('Dart 快照：接口 /auth/onekey/login', b'/auth/onekey/login' in app),
              ('Dart 快照：通道 fishing/onekey',    b'fishing/onekey' in app),
              # ★ Swift 侧别拿短字符串当探针！Swift 对 **≤15 字节** 的字面量做
              #   small-string 内联（直接编进指令），不进 __cstring：
              #   fishing/wechat(14)、not_integrated(14) 搜不到是正常的，
              #   而 fishing/shortcuts(17)、pending_shortcut(16) 能搜到。
              #   这里用 33 字节的中文文案当探针才可靠。
              ('Swift 桥：微信登录文案', '当前版本未内置微信登录'.encode('utf-8') in runner),
              # onekey 通道名 fishing/onekey 只有 14 字节，会被 Swift 内联成指令；
              # 换 >15 字节的中文错误文案当探针才搜得到。
              ('Swift 桥：一键登录文案',
               'iOS 需要运营商取号服务，当前版本未内置'.encode('utf-8') in runner),
              ('Swift 快捷入口：fishing/shortcuts',  b'fishing/shortcuts' in runner),
              ('Info.plist：weixin 查询 scheme',
               'weixin' in (pl.get('LSApplicationQueriesSchemes') or [])),
              ('Info.plist：ATS 放行明文',
               (pl.get('NSAppTransportSecurity') or {}).get('NSAllowsArbitraryLoads') is True),
          ]
          bad = []
          for name, ok in checks:
              print(('OK   ' if ok else 'MISS ') + name)
              if not ok: bad.append(name)
          print('版本:', pl.get('CFBundleShortVersionString'), pl.get('CFBundleVersion'))
          # 版本号必须与 pubspec 对齐，否则用户装了还是看到旧版本号
          want = open('pubspec.yaml', encoding='utf-8').read().split('version:')[1].split()[0]
          ver, build = want.split('+')
          if pl.get('CFBundleShortVersionString') != ver:
              print('!! CFBundleShortVersionString 期望', ver,
                    '实际', pl.get('CFBundleShortVersionString')); bad.append('版本号')
          if str(pl.get('CFBundleVersion')) != build:
              print('!! CFBundleVersion 期望', build, '实际', pl.get('CFBundleVersion'))
              bad.append('构建号')
          if bad:
              print('!! 产物缺东西，别发布:', bad); sys.exit(1)
          PY

      - name: 打包未签名 ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry 垂钓圈-unsigned.ipa Payload
          mv 垂钓圈-unsigned.ipa "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE" && rm -rf Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fishing-ios-unsigned-ipa
          path: 垂钓圈-unsigned.ipa
          retention-days: 30
